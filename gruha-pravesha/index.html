<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gruha Pravesha | Amrutha & Kushan</title><style>
*{box-sizing:border-box}body{margin:0;background:#efe0c4;color:#4d301e;font-family:Georgia,serif}.shell{max-width:1312px;margin:auto}.art{position:relative;width:100%;aspect-ratio:1312/1199;background:url('invitation-design.png') center/100% 100% no-repeat}.tagline{position:absolute;left:13.5%;top:45.1%;width:35%;height:6%;background:#f9ead0;display:flex;align-items:center;justify-content:center;text-align:center;color:#3b511e;font-size:clamp(10px,1.7vw,23px)}.field{position:absolute;left:59%;width:34%;border:0;outline:0;background:transparent;font:clamp(9px,1.35vw,17px) Georgia,serif;padding:0 2%;color:#4d301e}.field:focus{background:#fffaf0ee;box-shadow:0 0 0 2px #a2173b;border-radius:5px}.field::placeholder{color:transparent}.name{top:36.6%;height:3.6%}.email{top:44.1%;height:3.6%}.guests{top:60.6%;height:3.7%;appearance:none;cursor:pointer}.message{top:69.1%;height:6.4%;resize:none}.attend{position:absolute;top:52%;height:4.9%;cursor:pointer;opacity:0}.yes{left:58%;width:17.7%}.no{left:76%;width:18%}.selection{position:absolute;top:52.1%;height:4.7%;border:2px solid #a31a43;border-radius:8px;pointer-events:none;display:none}.selection.y{left:58%;width:17.7%}.selection.n{left:76%;width:18%}#yes:checked~.selection.y,#no:checked~.selection.n{display:block}.submit{position:absolute;left:65%;top:77%;width:23%;height:4.5%;cursor:pointer;border:0;background:transparent;color:transparent}.submit:focus-visible{outline:3px solid #a2173b}.map{position:absolute;left:17%;top:66.4%;width:20%;height:4%;font-size:0}.status{position:absolute;left:57%;top:83%;width:39%;text-align:center;font:clamp(9px,1.15vw,15px) Arial,sans-serif;color:#822039;background:#fff8e9df;border-radius:5px;padding:5px}.small{max-width:900px;margin:12px auto 28px;text-align:center;padding:0 16px;font:14px/1.6 Arial,sans-serif}.small strong{color:#a3193e}.thanks{display:none;position:absolute;left:56%;top:34%;width:40%;height:47%;background:#fff4dff2;border:2px solid #d2a05b;border-radius:12px;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:5%;font-size:clamp(14px,2.4vw,29px)}.thanks.show{display:flex}@media(max-width:700px){.art{width:200%;margin-left:0;transform-origin:top left}.shell{overflow:hidden}.shell.mobile-right .art{margin-left:-100%}.mobile-switch{display:flex;gap:8px;justify-content:center;padding:12px}.mobile-switch button{border:1px solid #aa8a54;background:#fff7e8;padding:9px 15px;border-radius:30px;color:#81243c}.tagline{font-size:2.6vw}.field{font-size:2.5vw}.status{font-size:2vw}.small{margin-top:0}}@media(min-width:701px){.mobile-switch{display:none}}
</style></head><body><div class="mobile-switch"><button onclick="document.querySelector('.shell').classList.remove('mobile-right')">Invitation</button><button onclick="document.querySelector('.shell').classList.add('mobile-right')">RSVP</button></div><main class="shell"><div class="art"><div class="tagline">of our New Home</div><a class="map" aria-label="View on Google Maps" href="https://www.google.com/maps/search/?api=1&amp;query=678%20Ohlone%20Street%2C%20Milpitas%2C%20CA%2095035" target="_blank" rel="noopener">Maps</a><form id="rsvp" aria-label="RSVP form"><input class="field name" name="name" required placeholder="Full name" aria-label="Full name" autocomplete="name"><input class="field email" name="email" type="email" required placeholder="Email" aria-label="Email address" autocomplete="email"><input id="yes" class="attend yes" name="attending" type="radio" value="Yes" checked aria-label="Yes, I'll be there"><input id="no" class="attend no" name="attending" type="radio" value="No" aria-label="Sorry, can't make it"><span class="selection y"></span><span class="selection n"></span><select class="field guests" name="guests" aria-label="Number of guests including yourself"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select><textarea class="field message" name="message" aria-label="Optional wishes"></textarea><button class="submit" type="submit" aria-label="Submit RSVP">Submit RSVP</button><div id="status" class="status" role="status">RSVP setup pending — submissions are not enabled yet.</div></form><div class="thanks" id="thanks"><div style="font-size:2em">❀</div><h2>Thank you!</h2><p>Your RSVP has been received.</p></div></div></main><p class="small">Sunday, November 1, 2026 • 10:00 AM onwards • 678 Ohlone Street, Milpitas, CA 95035<br><strong id="setupnote">RSVP is not active until the Google Apps Script URL is configured.</strong></p><script>
// After deploying the Google Apps Script web app, paste its /exec URL between the quotes below.
const RSVP_ENDPOINT = '';
const form=document.getElementById('rsvp');document.getElementById('no').addEventListener('change',()=>{form.elements.guests.value='1';form.elements.guests.disabled=true});document.getElementById('yes').addEventListener('change',()=>form.elements.guests.disabled=false);
if(RSVP_ENDPOINT){document.getElementById('status').textContent='';document.getElementById('setupnote').textContent='';}
form.addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');if(!RSVP_ENDPOINT){status.textContent='RSVP is not yet connected. Please check back soon.';return;}const b=form.querySelector('.submit');b.disabled=true;status.textContent='Sending your RSVP…';const data={name:form.elements.name.value.trim(),email:form.elements.email.value.trim(),attending:form.elements.attending.value,guests:form.elements.attending.value==='Yes'?Number(form.elements.guests.value):0,message:form.elements.message.value.trim()};try{const r=await fetch(RSVP_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const result=await r.json();if(!result.ok)throw Error(result.error||'Submission failed');document.getElementById('thanks').classList.add('show');form.style.display='none'}catch(err){status.textContent='Could not submit. Please try again later.';b.disabled=false}});
</script></body></html>
